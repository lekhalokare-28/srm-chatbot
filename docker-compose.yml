version: "3.9"

services:

  # Backend API
  backend:
    build: .
    container_name: srm_chatbot_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data        # persist scraped data
    restart: always

  # Frontend UI
  frontend:
    image: nginx:alpine
    container_name: srm_chatbot_frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    restart: always
    depends_on:
      - backend

  # Scheduler — keeps knowledge base fresh
  scheduler:
    build: .
    container_name: srm_chatbot_scheduler
    command: python3 scheduler.py
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: always
    depends_on:
      - backend
